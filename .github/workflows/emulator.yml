name: emulator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  real-adbd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.8.2 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # Emulator images run adbd with ro.adb.secure=0, so this covers the protocol, not key auth.
      # The TLS listener is started via the prop instead of Wireless debugging, which needs a dialog;
      # RealAdbdWirelessOffTest is excluded because adb_wifi_enabled stays 0 that way.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: |
            adb root && adb wait-for-device && adb shell setprop persist.adb.tls_server.enable 1 && sleep 5
            echo "tls port: $(adb shell getprop service.adb.tls.port)"
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.connectPort=$(adb shell getprop service.adb.tls.port | tr -d '\r') -Pandroid.testInstrumentationRunnerArguments.notClass=io.github.sarat03.phonewarden.tls.RealAdbdWirelessOffTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/
