name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew :adb:test :engine:test :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:lintDebug
      - run: python3 -m unittest -v
      # ADR 0002: sockets only in Session.kt and tls/, to the phone's own adbd; no URL or HTTP client anywhere
      - name: No network code outside the adb connection
        run: |
          ! grep -rnE 'java\.net\.(Socket|ServerSocket|DatagramSocket|MulticastSocket|URL|HttpURLConnection)\b|javax\.net\.ssl\.HttpsURLConnection|java\.nio\.channels\.(Socket|DatagramSocket)Channel|okhttp3|io\.ktor|retrofit2' \
              --include='*.kt' adb/src/main engine/src/main app/src/main \
            | grep -vE '^app/src/main/kotlin/io/github/sarat03/monomode/(Session\.kt|tls/)'
