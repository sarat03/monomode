name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :adb:test :engine:test :app:assembleDebug :app:compileDebugAndroidTestKotlin :app:lintDebug
      - run: python3 -m unittest -v
      # ADR 0002: sockets only in Session.kt and tls/, to the phone's own adbd; no URL or HTTP client anywhere.
      # ADR 0010 narrows it: update/UpdateCheck.kt alone may make the one HTTPS update check
      - name: No network code outside the adb connection
        run: |
          ! grep -rnE 'java\.net\.(Socket|ServerSocket|DatagramSocket|MulticastSocket|URL|HttpURLConnection)\b|javax\.net\.ssl\.HttpsURLConnection|java\.nio\.channels\.(Socket|DatagramSocket)Channel|okhttp3|io\.ktor|retrofit2' \
              --include='*.kt' adb/src/main engine/src/main app/src/main \
            | grep -vE '^app/src/main/kotlin/io/github/sarat03/monomode/(Session\.kt|tls/|update/UpdateCheck\.kt)'
